<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>remodeck — Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111113}
a{color:#8AB4F8}a:hover{color:#B5CEFA}
button{font:inherit;cursor:pointer}
input{font:inherit}
</style>
</helmet>
<div style="font-family: 'Geist', 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: #ECECEE; background: #111113; min-height: 900px; position: relative; display: flex; flex-direction: column;">

  <!-- Dimmed app behind -->
  <div aria-hidden="true" style="flex: 1; display: flex; flex-direction: column;">
    <div style="height: 46px; background: #18181B; border-bottom: 1px solid #27272A; display: flex; align-items: center; gap: 8px; padding: 0 12px;">
      <div style="width: 22px; height: 22px; border-radius: 6px; background: #ECECEE;"></div>
      <div style="width: 96px; height: 30px; border-radius: 8px; border: 1px solid #27272A;"></div>
      <div style="width: 160px; height: 30px; border-radius: 8px; border: 1px solid #27272A;"></div>
    </div>
    <div style="flex: 1; display: flex;">
      <div style="width: 52px; background: #18181B; border-right: 1px solid #27272A;"></div>
      <div style="flex: 1; display: flex; gap: 8px; padding: 8px;">
        <div style="flex: 0 0 250px; background: #18181B; border: 1px solid #27272A; border-radius: 10px;"></div>
        <div style="flex: 0 0 340px; background: #18181B; border: 1px solid #27272A; border-radius: 10px;"></div>
        <div style="flex: 1; background: #18181B; border: 1px solid #27272A; border-radius: 10px;"></div>
      </div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55);"></div>

  <!-- Palette -->
  <div style="position: absolute; left: 0; right: 0; top: 96px; display: flex; justify-content: center; padding: 0 16px;">
    <div role="dialog" aria-label="Command palette" style="width: 100%; max-width: 620px; background: #1C1C1F; border: 1px solid #2E2E33; border-radius: 14px; box-shadow: 0 24px 80px rgba(0,0,0,0.55); overflow: hidden;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 0 16px; height: 52px; border-bottom: 1px solid #2A2A2F;">
        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <label for="cmd-input" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search commands</label>
        <input id="cmd-input" value="pu" style="flex: 1; border: none; outline: none; background: transparent; color: #ECECEE; font-size: 15px;">
        <span style="font-size: 12px; color: #A1A1AA; padding: 2px 8px; border-radius: 6px; background: #26262A;">relist-panel</span>
      </div>

      <div style="padding: 6px; display: flex; flex-direction: column; max-height: 520px; overflow: auto;">
        <div style="padding: 8px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8B8B94;">Actions</div>
        <button style="display: flex; align-items: center; gap: 12px; padding: 0 10px; height: 40px; border: none; border-radius: 8px; background: #2A2F3A; color: #ECECEE; text-align: left;">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8AB4F8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
          <span style="flex: 1;"><span style="font-weight: 600;">Pu</span>sh feat/listing-filters <span style="color: #A1A1AA;">→ origin</span></span>
          <span style="font-size: 12px; color: #A1A1AA;">3 commits</span>
          <kbd style="font-family: 'Geist Mono', monospace; font-size: 11px; padding: 1px 6px; border: 1px solid #3A3A40; border-radius: 4px; color: #C4C4CC;">Ctrl P</kbd>
        </button>
        <button style="display: flex; align-items: center; gap: 12px; padding: 0 10px; height: 40px; border: none; border-radius: 8px; background: transparent; color: #ECECEE; text-align: left;">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/></svg>
          <span style="flex: 1;">Open <span style="font-weight: 600;">pu</span>ll request</span>
        </button>
        <button style="display: flex; align-items: center; gap: 12px; padding: 0 10px; height: 40px; border: none; border-radius: 8px; background: transparent; color: #ECECEE; text-align: left;">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
          <span style="flex: 1;">Compose <span style="font-weight: 600;">pu</span>ll — relist</span>
          <span style="font-size: 12px; color: #A1A1AA;">Containers</span>
        </button>

        <div style="padding: 12px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8B8B94;">Branches</div>
        <button style="display: flex; align-items: center; gap: 12px; padding: 0 10px; height: 36px; border: none; border-radius: 8px; background: transparent; color: #ECECEE; text-align: left;">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>
          <span style="flex: 1;">agent/<span style="font-weight: 600;">pu</span>blish-flow</span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #A1A1AA;">↑2</span>
        </button>

        <div style="padding: 12px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8B8B94;">Files</div>
        <button style="display: flex; align-items: center; gap: 12px; padding: 0 10px; height: 36px; border: none; border-radius: 8px; background: transparent; color: #ECECEE; text-align: left;">
          <span style="width: 16px; text-align: center; font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 600; color: #E2BD75;">M</span>
          <span style="flex: 1; font-family: 'Geist Mono', monospace; font-size: 12px;"><span style="color: #A1A1AA;">src/</span><span style="font-weight: 600;">pu</span>blic-routes.ts</span>
        </button>

        <div style="padding: 12px 10px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8B8B94;">Go to</div>
        <button style="display: flex; align-items: center; gap: 12px; padding: 0 10px; height: 36px; border: none; border-radius: 8px; background: transparent; color: #ECECEE; text-align: left;">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><path d="M6 6h.01M6 18h.01"/></svg>
          <span style="flex: 1;">Switch host…</span>
          <kbd style="font-family: 'Geist Mono', monospace; font-size: 11px; padding: 1px 6px; border: 1px solid #3A3A40; border-radius: 4px; color: #C4C4CC;">Ctrl H</kbd>
        </button>
      </div>

      <div style="display: flex; align-items: center; gap: 16px; padding: 0 16px; height: 38px; border-top: 1px solid #2A2A2F; font-size: 12px; color: #A1A1AA;">
        <span><kbd style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #C4C4CC;">↑↓</kbd> navigate</span>
        <span><kbd style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #C4C4CC;">Enter</kbd> run</span>
        <span><kbd style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #C4C4CC;">Esc</kbd> close</span>
        <div style="flex: 1;"></div>
        <span>Type <kbd style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #C4C4CC;">&gt;</kbd> for commands only</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
