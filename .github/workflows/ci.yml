name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks and installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      # The default temp dir is an 8.3 short path (RUNNER~1) that Git reports in its long form.
      # The runner context is not available in job-level env, so export it for later steps.
      - name: Use a long-path temp directory
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select Git for Windows Bash
        shell: pwsh
        run: |
          $taskGitBin = Join-Path $env:ProgramFiles 'Git/bin'
          if (!(Test-Path -LiteralPath (Join-Path $taskGitBin 'bash.exe'))) {
            throw 'Git for Windows Bash is required by the integration tests'
          }
          $taskGitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          git config --global init.defaultBranch main
      - run: npm ci --ignore-scripts=false
      - run: npm audit
      - run: npm run install:electron
      - run: npm run check:native
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=4
      - run: npm run build:win
      - name: Keep unsigned installer for testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x64-unsigned
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: git config --global init.defaultBranch main
      - run: npm ci --ignore-scripts=false
      - run: npm run install:electron
      - run: npm run check:native
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=4
