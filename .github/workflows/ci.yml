name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks and installer
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The default temp dir is an 8.3 short path (RUNNER~1) that Git reports in its long form.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Select Git for Windows Bash
        shell: pwsh
        run: |
          $taskGitBin = Join-Path $env:ProgramFiles 'Git/bin'
          if (!(Test-Path -LiteralPath (Join-Path $taskGitBin 'bash.exe'))) {
            throw 'Git for Windows Bash is required by the integration tests'
          }
          $taskGitBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          git config --global init.defaultBranch main
      - run: npm ci --ignore-scripts=false
      - run: npm audit
      - run: npm run install:electron
      - run: npm run check:native
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=4
      - run: npm run build:win
      - name: Keep unsigned installer for testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-unsigned
          path: dist/*-setup.exe
          if-no-files-found: error
          retention-days: 7
