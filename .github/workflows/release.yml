name: Release

# Builds installers on each platform's own runner (node-pty is native and cannot be cross-compiled)
# and attaches them to the GitHub release that triggered the run.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            build: build:win
            files: |
              dist/*-setup.exe
          - name: macOS
            os: macos-latest
            build: build:mac
            files: |
              dist/*.dmg
              dist/*.zip
          - name: Linux
            os: ubuntu-latest
            build: build:linux
            files: |
              dist/*.AppImage
              dist/*.deb
    env:
      # Installers are unsigned until a signing certificate is configured in repository secrets.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Check tag matches package version
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Release tag $TAG does not match package.json $version"
            exit 1
          fi
      - run: npm ci --ignore-scripts=false
      - run: npm run install:electron
      - run: npm run check:native
      - run: npm run ${{ matrix.build }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach installers to release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Write checksums
        working-directory: assets
        run: sha256sum * | tee SHA256SUMS.txt
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
