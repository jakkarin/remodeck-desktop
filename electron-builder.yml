appId: dev.remodeck.desktop
productName: remodeck
directories:
  buildResources: build
files:
  - out/**/*
  - resources/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - licenses/**/*
asarUnpack:
  - resources/**
win:
  executableName: remodeck
  icon: build/icon.ico
nsis:
  # Assisted wizard (Next → Next → Finish with "Run remodeck") instead of the silent one-click install.
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  icon: build/icon.icns
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  maintainer: jakkarin <Jakkarinwebmaster@gmail.com>
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# No auto-updater ships; stop electron-builder inferring GitHub publishing from package.json.
publish: null
